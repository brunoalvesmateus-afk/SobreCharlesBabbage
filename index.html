<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Site educativo sobre Charles Babbage, pioneiro da computação e criador dos projetos da Máquina Diferencial e da Máquina Analítica."
  >

  <title>Charles Babbage — O Pai do Computador</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #e8f0f7;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* =========================
       NAVBAR
    ========================== */

    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;

      padding: 18px 7%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: rgba(7, 17, 31, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: #55d6be;
      letter-spacing: 1px;
    }

    nav ul {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    nav a {
      color: #dce7ef;
      text-decoration: none;
      transition: 0.3s ease;
    }

    nav a:hover {
      color: #55d6be;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 120px 8% 70px;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 80% 30%,
          rgba(48, 135, 151, 0.25),
          transparent 35%
        ),
        radial-gradient(
          circle at 20% 80%,
          rgba(45, 76, 128, 0.25),
          transparent 35%
        ),
        #07111f;
    }

    .hero-content {
      max-width: 800px;
    }

    .tag {
      display: inline-block;

      padding: 7px 15px;

      border: 1px solid #55d6be;
      color: #55d6be;

      border-radius: 30px;

      margin-bottom: 20px;

      font-size: 0.9rem;
    }

    h1 {
      font-size: clamp(3.2rem, 8vw, 7rem);
      line-height: 0.95;

      margin-bottom: 25px;

      letter-spacing: -5px;
    }

    h1 span {
      color: #55d6be;
    }

    .hero p {
      font-size: 1.2rem;
      color: #aebdca;

      max-width: 650px;

      margin-bottom: 35px;
    }

    .button {
      display: inline-block;

      background: #55d6be;
      color: #07111f;

      padding: 13px 25px;

      border-radius: 8px;

      text-decoration: none;
      font-weight: bold;

      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 30px rgba(85, 214, 190, 0.2);
    }

    /* =========================
       SECTIONS
    ========================== */

    section {
      padding: 100px 8%;
      scroll-margin-top: 80px;
    }

    .section-title {
      font-size: 2.8rem;
      margin-bottom: 15px;
    }

    .section-title span {
      color: #55d6be;
    }

    .section-intro {
      color: #9eafbd;
      max-width: 700px;
      margin-bottom: 50px;
    }

    /* =========================
       BIOGRAFIA
    ========================== */

    .bio {
      background: #0b1929;
    }

    .bio-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 60px;

      align-items: center;
    }

    .bio-text p {
      margin-bottom: 18px;
      color: #b7c4ce;
    }

    /* =========================
       FOTO
    ========================== */

    .portrait {
      width: 100%;
      min-height: 500px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #132c42,
          #08121f
        );

      border: 1px solid rgba(85, 214, 190, 0.2);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.25);

      overflow: hidden;
    }

    .portrait-inner {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /*
      ÁREA DA FOTO

      A imagem ocupa uma área proporcional,
      evitando que fique esticada ou deformada.
    */

    .portrait-image {
      width: min(100%, 330px);
      aspect-ratio: 3 / 4;

      object-fit: cover;
      object-position: center;

      display: block;

      border-radius: 18px;

      border: 3px solid rgba(85, 214, 190, 0.65);

      background: #102437;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(85, 214, 190, 0.08);

      transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        border-color 0.4s ease;
    }

    .portrait-image:hover {
      transform: scale(1.025);

      border-color: #55d6be;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.55),
        0 0 35px rgba(85, 214, 190, 0.18);
    }

    .portrait-inner h3 {
      font-size: 1.7rem;
      margin-top: 25px;
    }

    .portrait-inner p {
      color: #7f929f;
      margin-top: 4px;
    }

    /* =========================
       TIMELINE
    ========================== */

    .timeline {
      position: relative;

      max-width: 900px;

      margin: auto;
    }

    .timeline::before {
      content: "";

      position: absolute;

      left: 20px;
      top: 0;
      bottom: 0;

      width: 2px;

      background: #245264;
    }

    .timeline-item {
      position: relative;

      padding-left: 65px;

      margin-bottom: 45px;
    }

    .timeline-dot {
      position: absolute;

      left: 11px;
      top: 5px;

      width: 20px;
      height: 20px;

      border-radius: 50%;

      background: #55d6be;

      box-shadow:
        0 0 20px rgba(85, 214, 190, 0.5);
    }

    .timeline-year {
      color: #55d6be;

      font-weight: bold;

      font-size: 1.2rem;
    }

    .timeline-item h3 {
      margin: 5px 0;

      font-size: 1.4rem;
    }

    .timeline-item p {
      color: #9eafbd;
    }

    /* =========================
       MÁQUINAS
    ========================== */

    .engines {
      background: #0b1929;
    }

    .cards {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 30px;
    }

    .card {
      padding: 35px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #102437,
          #0b1826
        );

      border: 1px solid rgba(255, 255, 255, 0.07);

      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);

      border-color:
        rgba(85, 214, 190, 0.4);
    }

    .card-number {
      font-size: 3rem;

      color: #55d6be;

      font-weight: bold;

      opacity: 0.7;
    }

    .card h3 {
      font-size: 1.8rem;

      margin: 10px 0;
    }

    .card p {
      color: #9eafbd;
    }

    /* =========================
       MÁQUINA ANALÍTICA
    ========================== */

    .analytical {
      text-align: center;

      background:
        radial-gradient(
          circle at center,
          rgba(48, 135, 151, 0.13),
          transparent 45%
        ),
        #07111f;
    }

    .machine {
      margin: 50px auto;

      max-width: 850px;

      padding: 50px;

      border: 1px solid #1d4556;

      border-radius: 25px;

      background: #091725;

      overflow: hidden;
    }

    .gears {
      font-size: 5rem;

      letter-spacing: 15px;

      color: #55d6be;

      animation: rotate 12s linear infinite;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .machine p {
      color: #aebdca;

      max-width: 650px;

      margin: 25px auto 0;
    }

    /* =========================
       LEGADO
    ========================== */

    .legacy-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;
    }

    .legacy-card {
      padding: 30px;

      background: #0d1c2c;

      border-radius: 15px;

      border-top:
        3px solid #55d6be;

      transition: 0.3s ease;
    }

    .legacy-card:hover {
      transform: translateY(-5px);

      background: #102437;
    }

    .legacy-card h3 {
      margin-bottom: 10px;
    }

    .legacy-card p {
      color: #9eafbd;
    }

    /* =========================
       QUOTE
    ========================== */

    .quote {
      padding: 110px 8%;

      text-align: center;

      background: #55d6be;

      color: #07111f;
    }

    .quote blockquote {
      max-width: 900px;

      margin: auto;

      font-size:
        clamp(1.8rem, 4vw, 3rem);

      font-weight: bold;

      line-height: 1.2;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      text-align: center;

      padding: 40px;

      background: #050c15;

      color: #728391;
    }

    footer strong {
      color: #55d6be;
    }

    /* =========================
       RESPONSIVIDADE
    ========================== */

    @media (max-width: 900px) {

      nav {
        padding: 16px 5%;
      }

      nav ul {
        gap: 12px;
      }

      nav a {
        font-size: 0.85rem;
      }

      .bio-grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .legacy-grid {
        grid-template-columns: 1fr;
      }

      .portrait {
        min-height: auto;
      }
    }

    @media (max-width: 700px) {

      nav ul {
        display: none;
      }

      .hero {
        padding:
          120px 6% 70px;
      }

      h1 {
        letter-spacing: -3px;
      }

      section {
        padding: 75px 6%;
      }

      .section-title {
        font-size: 2.2rem;
      }

      .portrait {
        padding: 25px;
      }

      .portrait-image {
        width: min(100%, 280px);
      }

      .machine {
        padding: 35px 20px;
      }

      .gears
